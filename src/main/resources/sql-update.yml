             userid            int           not null comment '管理员ID',
             credential_id     varchar(512)  not null comment 'base64url编码的凭据ID',
             public_key        text          not null comment 'base64url编码的COSE公钥',
             sign_count        bigint        default 0 not null comment '签名计数器',
