  1.3.4_7:
    1:
      - "alter table master
                   add public_ip_mode varchar(20) default 'legacy' not null comment 'VPC公网接入模式 legacy/routed/l2_alias/proxy_arp',
                   add public_ip_interface varchar(64) null comment 'VPC公网接入物理网卡';"
      - "update master
                   set public_ip_mode = 'legacy'
                   where public_ip_mode is null
                      or trim(public_ip_mode) = '';"
      - "alter table vpc_ip_binding
                   add delivery_mode varchar(20) default 'legacy' not null comment '公网接入模式',
                   add interface_name varchar(64) null comment '公网接入物理网卡',
                   add address_installed int default 0 not null comment '是否由QAgent添加了公网地址',
                   add route_installed int default 0 not null comment '是否由QAgent添加了公网路由',
                   add last_check_time bigint null,
                   add last_error varchar(1024) null;"
      - "update vpc_ip_binding
                   set delivery_mode = 'legacy'
                   where delivery_mode is null
                      or trim(delivery_mode) = '';"
