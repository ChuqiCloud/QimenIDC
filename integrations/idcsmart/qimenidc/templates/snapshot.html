        <button class="btn btn-primary" id="confirmRollbackSnapshotBtn">确认回滚</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentSnapshotName = '';

  $(document).ready(function() {
    $(document).on('click', '#confirmCreateSnapshotBtn', function() {
      handleCreateSnapshot();
    });

    $(document).on('click', '.deleteSnapshotsnapshot', function() {
      currentSnapshotName = $(this).data('name');
      $('#deleteSnapshotName').text(currentSnapshotName);
      $('#deleteModalsnapshot').modal('show');
    });

    $(document).on('click', '.rollbackSnapshotsnapshot', function() {
      currentSnapshotName = $(this).data('name');
      $('#rollbackSnapshotName').text(currentSnapshotName);
      $('#rollbackModalsnapshot').modal('show');
    });

    $(document).on('click', '#confirmDeleteSnapshotBtn', function() {
      handleSnapshotAction('deleteSnapshot', '#confirmDeleteSnapshotBtn', '#deleteModalsnapshot', '删除');
    });

    $(document).on('click', '#confirmRollbackSnapshotBtn', function() {
      handleSnapshotAction('rollbackSnapshot', '#confirmRollbackSnapshotBtn', '#rollbackModalsnapshot', '回滚');
    });
  });

  function reloadSnapshotTable() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id') || '{$Think.get.id}';
    const requestUrl = '/provision/custom/content?id=' + id + '&key=snapshot&_t=' + Date.now();

    $.ajax({
      url: requestUrl,
      type: 'GET',
      dataType: 'html',
      success: function(html) {
        if (html && html.trim().length > 0) {
          const $temp = $('<div>').html(html);
          const $newTable = $temp.find('#snapshotTableWrapper');
          if ($newTable.length > 0) {
            $('#snapshotTableWrapper').html($newTable.html());
          } else {
            $('#snapshotTableWrapper').html(html);
          }
        } else {
          window.location.reload();
        }
      },
      error: function() {
        window.location.reload();
      }
    });
  }

  function handleCreateSnapshot() {
    const name = $('#snapshotName').val().trim();
    const nameReg = /^[A-Za-z0-9_][A-Za-z0-9_-]{0,63}$/;

    $('#snapshotNameFeedback').text('').hide();
    $('#snapshotName').removeClass('is-invalid');

    if (name && !nameReg.test(name)) {
      $('#snapshotNameFeedback').text('名称只能包含字母、数字、下划线、中划线，并且需以字母、数字或下划线开头').show();
      $('#snapshotName').addClass('is-invalid');
      return;
    }

    const formData = new URLSearchParams();
    formData.append('func', 'addSnapshot');
    formData.append('snapname', name);
    formData.append('vmstate', $('#snapshotVmstate').is(':checked') ? '1' : '0');
    formData.append('description', $('#snapshotDescription').val().trim());

    const btn = $('#confirmCreateSnapshotBtn');
    btn.prop('disabled', true);

    $.ajax({
      url: "{$MODULE_CUSTOM_API}",
      type: 'POST',
      data: formData.toString(),
      contentType: 'application/x-www-form-urlencoded',
      success: function(data) {
        btn.prop('disabled', false);
        if (data.status == 200) {
          $('#addModalsnapshot').modal('hide');
          $('#snapshotForm')[0].reset();
          showSnapshotSuccess(data.msg || '创建成功');
          reloadSnapshotTable();
        } else {
          showSnapshotError(data.msg || '创建失败');
        }
      },
      error: function(xhr, status, error) {
        btn.prop('disabled', false);
        showSnapshotError('创建出错: ' + error);
      }
    });
  }

  function handleSnapshotAction(func, btnSelector, modalSelector, actionName) {
    if (!currentSnapshotName) {
      return;
    }

    const btn = $(btnSelector);
    btn.prop('disabled', true);

    const formData = new URLSearchParams();
    formData.append('func', func);
    formData.append('snapname', currentSnapshotName);

    $.ajax({
      url: "{$MODULE_CUSTOM_API}",
      type: 'POST',
      data: formData.toString(),
      contentType: 'application/x-www-form-urlencoded',
      success: function(data) {
        btn.prop('disabled', false);
        $(modalSelector).modal('hide');
        currentSnapshotName = '';
        if (data.status == 200) {
          showSnapshotSuccess(data.msg || actionName + '成功');
          reloadSnapshotTable();
        } else {
          showSnapshotError(data.msg || actionName + '失败');
        }
      },
      error: function(xhr, status, error) {
        btn.prop('disabled', false);
        $(modalSelector).modal('hide');
        showSnapshotError(actionName + '出错: ' + error);
      }
    });
  }

  function showSnapshotSuccess(message) {
    if (window.toastr) {
      toastr.success(message);
    } else if (window.Swal) {
      Swal.fire('成功', message, 'success');
    } else {
      alert(message);
    }
  }

  function showSnapshotError(message) {
    if (window.toastr) {
      toastr.error(message);
    } else if (window.Swal) {
      Swal.fire('失败', message, 'error');
    } else {
      alert(message);
    }
  }
</script>
