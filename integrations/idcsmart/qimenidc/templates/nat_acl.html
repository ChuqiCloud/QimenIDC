<!-- 删除确认模态框 -->
<div class="modal fade" id="deleteModalnatacl" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">确认删除</h5>
        <button type="button" class="close" data-dismiss="modal">

        </button>

        <p>确定要删除此NAT转发规则吗？此操作无法恢复。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-light" data-dismiss="modal">取消</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 全局变量存储当前要删除的数据
  let currentDeleteData = null;
  
  $(document).ready(function() {
    // 协议选择交互
    $(document).on('click', '.protocol-option', function() {
      $('.protocol-option').removeClass('active');
      $(this).addClass('active');
      $('#protocolSelect').val($(this).data('value'));
    });
    
    // 绑定确认创建按钮
    $(document).on('click', '#confirmCreateBtn', function() {
      handleCreateNatAcl();
    });
    
    // 绑定删除按钮事件 - 打开模态框
    $(document).on('click', '.deleteNATnatacl', function() {
      if ($(this).prop('disabled')) {
        return;
      }
      
      currentDeleteData = {
        btn: $(this),
        id: $(this).data('id'),
        extPort: $(this).data('ext-port'),
        intPort: $(this).data('int-port'),
        protocol: $(this).data('protocol')
      };
      
      $('#deleteModalnatacl').modal('show');
    });
    
    // 绑定确认删除按钮
    $(document).on('click', '#confirmDeleteBtn', function() {
      if (!currentDeleteData) return;
      
      handleDeleteNatAcl(
        currentDeleteData.btn,
        currentDeleteData.id,
        currentDeleteData.extPort,
        currentDeleteData.intPort,
        currentDeleteData.protocol
      );
    });
  });
  
  // 重新加载表格内容 - 使用专门的 content API
  function reloadNatTable() {
    // 从当前URL获取id参数
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id') || '{$Think.get.id}';
    
    const requestUrl = '/provision/custom/content?id=' + id + '&key=nat_acl&_t=' + Date.now();
    
    $.ajax({
      url: requestUrl,
      type: 'GET',
      dataType: 'html',
      success: function(html) {
        // 直接使用返回的HTML（这个API返回的就是表格片段）
        if (html && html.trim().length > 0) {
          // 检查返回的是否是完整HTML文档还是片段
          if (html.indexOf('<!DOCTYPE') > -1 || html.indexOf('<html') > -1) {
            // 返回的是完整页面，需要提取
            var $temp = $('<div>').html(html);
            var $newTable = $temp.find('#natTableWrapper');
            if ($newTable.length > 0) {
              $('#natTableWrapper').html($newTable.html());
              updateStatsFromDOM();
            } else {
              toastr.error('无法找到表格数据');
            }
          } else {
            // 返回的是HTML片段，直接替换
            $('#natTableWrapper').html(html);
            updateStatsFromDOM();
          }
        } else {
          toastr.error('返回数据为空');
        }
      },
      error: function(xhr, status, error) {
        console.error('请求失败:', status, error);
        toastr.error('更新表格失败: ' + error);
      }
    });
  }
  
  // 从DOM更新统计信息
  function updateStatsFromDOM() {
    // 计算当前表格行数
    const rowCount = $('#natTableWrapper tbody tr').length;
    const hasData = $('#natTableWrapper tbody tr td[colspan]').length === 0;
    const actualCount = hasData ? rowCount : 0;
    
    $('#natRuleCount').text(actualCount);
    $('#natUseCount').text(actualCount);
    
    // 控制统计区域显示
    $('#natStats').css('display', actualCount > 0 ? 'flex' : 'none');
  }
  
  // 创建NAT转发规则
  function handleCreateNatAcl() {
    const name = $('#natName').val().trim();
    const extPort = $('#extPort').val();
    const intPort = $('#intPort').val();
    const protocol = $('#protocolSelect').val();
    
    // 清除错误
    $('.invalid-feedback').text('').hide();
    $('.form-control').removeClass('is-invalid');
    
    // 验证
    let isValid = true;
    
    if (!name) {
      $('#name-feedbacknatacl').text('请填写规则名称').show();
      $('#natName').addClass('is-invalid');
      isValid = false;
    }
    
    if (!intPort) {
      $('#internalPort-feedbacknatacl').text('请填写内网端口').show();
      $('#intPort').addClass('is-invalid');
      isValid = false;
    } else if (parseInt(intPort) < 1 || parseInt(intPort) > 65535) {
      $('#internalPort-feedbacknatacl').text('请输入1-65535之间的端口号').show();
      $('#intPort').addClass('is-invalid');
      isValid = false;
    }
    
    if (!isValid) return;
    
    // 准备表单数据
    const formData = new URLSearchParams();
    formData.append('func', 'addNatAcl');
    formData.append('name', name);
    if (extPort) {
      formData.append('ext_port', extPort);
    }
    formData.append('int_port', intPort);
    formData.append('select-protocol', protocol);
    
    const confirmBtn = $('#confirmCreateBtn');
    confirmBtn.prop('disabled', true);
    
    $.ajax({
      url: "{$MODULE_CUSTOM_API}",
      type: 'POST',
      data: formData.toString(),
      contentType: 'application/x-www-form-urlencoded',
      success: function(data) {
        confirmBtn.prop('disabled', false);
        
        if (data.status == 200) {
          $('#addModalnatacl').modal('hide');
          toastr.success(data.msg || '创建成功');
          
          // 重置表单
          $('#natAclForm')[0].reset();
          $('.protocol-option').removeClass('active');
          $('.protocol-option[data-value="1"]').addClass('active');
          $('#protocolSelect').val('1');
          
          // 重新加载表格
          reloadNatTable();
        } else {
          toastr.error(data.msg || '创建失败');
        }
      },
      error: function(xhr, status, error) {
        confirmBtn.prop('disabled', false);
        toastr.error('创建出错: ' + error);
      }
    });
  }
  
  // 删除NAT转发规则
  function handleDeleteNatAcl(btn, id, extPort, intPort, protocol) {
    const confirmBtn = $('#confirmDeleteBtn');
    confirmBtn.prop('disabled', true);
    
    const formData = new URLSearchParams();
    formData.append('func', 'delNatAcl');
    formData.append('id', id);
    formData.append('source_port', extPort);
    formData.append('destination_port', intPort);
    formData.append('protocol', protocol);
    
    $.ajax({
      url: "{$MODULE_CUSTOM_API}",
      type: 'POST',
      data: formData.toString(),
      contentType: 'application/x-www-form-urlencoded',
      success: function(data) {
        confirmBtn.prop('disabled', false);
        $('#deleteModalnatacl').modal('hide');
        
        // 清空当前数据
        currentDeleteData = null;
        
        if (data.status == 200) {
          toastr.success(data.msg || '删除成功');
          
          // 重新加载表格
          reloadNatTable();
        } else {
          toastr.error(data.msg || '删除失败');
        }
      },
      error: function(xhr, status, error) {
        confirmBtn.prop('disabled', false);
        $('#deleteModalnatacl').modal('hide');
        toastr.error('删除出错: ' + error);
      }
    });
  }
</script>
